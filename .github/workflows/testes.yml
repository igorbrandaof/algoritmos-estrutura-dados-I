name: Testes Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algoritmos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testar cinco entregáveis e projeto final
        run: python executar_testes.py

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Disponibilizar display virtual
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Testar todas as suítes e widgets reais
        run: xvfb-run -a python executar_testes.py --gui
